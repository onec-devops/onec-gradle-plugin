name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # The functional tests need the platform, they run in the functional-test job.
      - run: ./gradlew build -x functionalTest

  functional-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        onec-version: [8.3.22.2557, 8.3.25.1633, 8.3.27.2342]
        edt-version: [2026.1.3]
        include:
          # The oldest platform runs the test builds on the oldest Gradle the plugin supports,
          # OnecPlugin.MINIMUM_GRADLE_VERSION, the others on the Gradle of the build.
          - onec-version: 8.3.22.2557
            test-gradle-version: 9.0.0
    # The image of the platform and 1C:EDT from https://github.com/onec-devops/onec-docker
    container:
      image: ghcr.io/${{ github.repository_owner }}/1cv8-server:${{ matrix.onec-version }}-edt-${{ matrix.edt-version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # The workspace belongs to the runner user, which has no entry in /etc/passwd of the
      # image, and the platform crashes for such a user.
      options: --user root
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: >-
          ./gradlew functionalTest
          -PtestPlatformVersion=${{ matrix.onec-version }}
          -PtestEdtVersion=${{ matrix.edt-version }}
          ${{ matrix.test-gradle-version && format('-PtestGradleVersion={0}', matrix.test-gradle-version) || '' }}
